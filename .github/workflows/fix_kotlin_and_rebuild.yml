name: Fix Kotlin and Rebuild
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Kotlin files from Upstream
        run: |
          UPSTREAM_URL="https://raw.githubusercontent.com/MatsuriDayo/NekoBoxForAndroid/master"
          
          files=(
            "app/src/main/java/io/nekohasekai/sagernet/utils/Commandline.kt"
            "app/src/main/java/io/nekohasekai/sagernet/utils/Subnet.kt"
            "app/src/main/java/moe/matsuri/nb4a/ui/EditConfigPreference.kt"
          )
          
          for file in "${files[@]}"; do
            echo "Restoring $file from upstream..."
            curl -sSL "$UPSTREAM_URL/$file" -o "$file"
          done
          
          # Re-apply rebranding
          # Note: The original package name is io.nekohasekai.sagernet or moe.matsuri.nb4a
          # We want to change it to pkg.pkkstore
          find . -type f -name "*.kt" -exec sed -i 's/io\.nekohasekai\.sagernet/pkg.pkkstore/g' {} +
          find . -type f -name "*.kt" -exec sed -i 's/moe\.matsuri\.nb4a/pkg.pkkstore/g' {} +
          find . -type f -name "*.kt" -exec sed -i 's/NekoBox/PKKStore/g' {} +
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Restore Kotlin files from upstream and re-apply rebranding" || echo "No changes to commit"
          git push

  trigger-build:
    needs: fix
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Build Workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'

name: Fix Kotlin and Rebuild

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Restore Kotlin files
        run: |
          # Restore all .kt files from a known good commit (before backslash mess)
          # Commit 793fb29 was "Add files via upload" by relax99099, should be clean of my automated fixes
          git checkout 793fb29 -- "*.kt"
          
          # Also check if libcore/nb4a.go needs to be kept
          # I fixed it in fda6dbc, so let's restore that one specifically if needed
          git checkout fda6dbc -- libcore/nb4a.go
          
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Restore Kotlin files to valid state" || echo "No changes to commit"
          git push origin main

  trigger-build:
    needs: fix
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Build Workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'

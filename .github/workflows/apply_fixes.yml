name: Apply Fixes
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebrand
        run: |
          find . -type f -name "*" -not -path "./.git/*" -exec sed -i 's/NekoBox/PKKStore/g' {} +
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Rebrand to PKKStore" || echo "No changes to commit"
          git push

name: Apply Fixes
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Move files
        run: |
          # Move strings.xml files
          mv strings_values.xml app/src/main/res/values/strings.xml
          for f in strings_values-*.xml; do
            dir=$(echo $f | sed 's/strings_//' | sed 's/\.xml//')
            mkdir -p app/src/main/res/$dir
            mv "$f" "app/src/main/res/$dir/strings.xml"
          done
          
          # Move other files
          mv nb4a.properties nb4a.properties
          mv Theme.kt app/src/main/java/io/nekohasekai/sagernet/utils/Theme.kt
          mv RawUpdater.kt app/src/main/java/io/nekohasekai/sagernet/group/RawUpdater.kt
          mv build.yml .github/workflows/build.yml
          
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply fixes and update project structure"
          git push

name: Apply Fixes

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix and Rebrand
        run: |
          cat << 'EOF' > fix_script.py
          import os
          import re

          def fix_file(path, replacements):
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  
                  original_content = content
                  for old, new in replacements:
                      content = content.replace(old, new)
                  
                  if content != original_content:
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
                      print(f"Fixed: {path}")
              except Exception as e:
                  print(f"Error fixing {path}: {e}")

          # 1. REVERT DANGEROUS REPLACEMENTS in source code
          for root, dirs, files in os.walk("app/src/main/java"):
              for file in files:
                  if file.endswith(".kt") or file.endswith(".java"):
                      path = os.path.join(root, file)
                      fix_file(path, [
                          ('package moe.pkkstore', 'package moe.matsuri'),
                          ('import moe.pkkstore', 'import moe.matsuri'),
                          ('package io.pkkstore', 'package io.nekohasekai'),
                          ('import io.pkkstore', 'import io.nekohasekai'),
                          ('RunMode_PKKStoreForAndroid', 'RunMode_NekoBoxForAndroid'),
                          ('PKKStoreForAndroid', 'NekoBoxForAndroid')
                      ])

          for root, dirs, files in os.walk("libcore"):
              for file in files:
                  if file.endswith(".go"):
                      path = os.path.join(root, file)
                      fix_file(path, [
                          ('package pkkstore', 'package matsuri'),
                          ('package pkkstore', 'package nekohasekai'),
                          ('RunMode_PKKStoreForAndroid', 'RunMode_NekoBoxForAndroid'),
                          ('PKKStoreForAndroid', 'NekoBoxForAndroid')
                      ])

          # 2. PROPER REBRANDING
          for root, dirs, files in os.walk("app/src/main/res"):
              for file in files:
                  if file == "strings.xml":
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                          content = re.sub(r'(<string name="app_name">)(.*?)(</string>)', r'\1PKKStore\3', content)
                          def escape_quotes(match):
                              tag_start = match.group(1)
                              text = match.group(2)
                              tag_end = match.group(3)
                              if "'" in text and not "\\'" in text:
                                  text = text.replace("'", "\\'")
                              return tag_start + text + tag_end
                          content = re.sub(r'(<string.*?>)(.*?)(</string>)', escape_quotes, content)
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(content)
                      except: pass

          fix_file("app/build.gradle.kts", [
              ('applicationId = "io.nekohasekai.sagernet"', 'applicationId = "pkg.pkkstore"'),
              ('applicationId = "moe.matsuri.nb4a"', 'applicationId = "pkg.pkkstore"')
          ])
          if os.path.exists("nb4a.properties"):
              fix_file("nb4a.properties", [
                  ('io.nekohasekai.sagernet', 'pkg.pkkstore'),
                  ('moe.matsuri.nb4a', 'pkg.pkkstore')
              ])

          theme_path = "app/src/main/java/io/nekohasekai/sagernet/utils/Theme.kt"
          if os.path.exists(theme_path):
              try:
                  with open(theme_path, "r", encoding="utf-8") as f:
                      content = f.read()
                  new_content = content.replace("0xFFE91E63", "0xFFFFC107").replace("0xFFF06292", "0xFFFFD54F")
                  if new_content != content:
                      with open(theme_path, "w", encoding="utf-8") as f:
                          f.write(new_content)
              except: pass

          EOF
          python3 fix_script.py
          rm fix_script.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Fix corruption and apply proper rebranding" || exit 0
          git push origin main

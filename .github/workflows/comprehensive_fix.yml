name: Comprehensive Fix and Build

on:
  workflow_dispatch:

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Comprehensive Fixes
        run: |
          python3 -c "
          import os
          import subprocess
          import re
          import urllib.request

          print('Restoring proxy and utils directories from git HEAD / upstream...')
          subprocess.run(['git', 'checkout', 'app/src/main/java/moe/matsuri/nb4a/proxy/'], check=False)
          subprocess.run(['git', 'checkout', 'app/src/main/java/pkg/pkkstore/proxy/'], check=False)
          subprocess.run(['git', 'checkout', 'app/src/main/res/'], check=False)

          def download_upstream(path):
              url = f'https://raw.githubusercontent.com/MatsuriDayo/NekoBoxForAndroid/master/{path}'
              try:
                  with urllib.request.urlopen(url) as response:
                      return response.read().decode('utf-8')
              except Exception as e:
                  print(f'Error downloading {path}: {e}')
                  return None

          # 1. Rebrand strings.xml across all values-* directories
          res_dir = 'app/src/main/res'
          for root, dirs, files in os.walk(res_dir):
              for file in files:
                  if file == 'strings.xml':
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          
                          content = content.replace('NekoBox', 'PKKStore').replace('Matsuri', 'PKKStore')
                          content = re.sub(r'<string name=\"app_name\" translatable=\"false\">.*?</string>', 
                                         '<string name=\"app_name\" translatable=\"false\">PKKStore</string>', content)
                          # Sanitize unescaped single quotes
                          content = re.sub(r\"(?<!\\\\)'\", \"\\\\'\", content)

                          with open(filepath, 'w', encoding='utf-8') as f:
                              f.write(content)
                      except Exception as e:
                          print(f'Error processing {filepath}: {e}')

          # 2. Rebrand package names across the codebase: io.nekohasekai.sagernet -> pkg.pkkstore
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'build' in root or '.gradle' in root:
                  continue
              for file in files:
                  if file.endswith(('.kt', '.java', '.xml', '.gradle', '.kts', '.properties', '.json')):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          
                          new_content = content.replace('io.nekohasekai.sagernet', 'pkg.pkkstore')
                          new_content = new_content.replace('NekoBox', 'PKKStore')
                          
                          if new_content != content:
                              with open(filepath, 'w', encoding='utf-8') as f:
                                  f.write(new_content)
                      except Exception as e:
                          print(f'Error updating {filepath}: {e}')

          # 3. Ensure build.gradle.kts and nb4a.properties are correct
          app_gradle = 'app/build.gradle.kts'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  content = f.read()
              content = re.sub(r'applicationId = \".*?\"', 'applicationId = \"pkg.pkkstore\"', content)
              with open(app_gradle, 'w') as f:
                  f.write(content)

          nb4a_props = 'nb4a.properties'
          if os.path.exists(nb4a_props):
              with open(nb4a_props, 'r') as f:
                  content = f.read()
              content = re.sub(r'flavor=.*', 'flavor=oss', content)
              with open(nb4a_props, 'w') as f:
                  f.write(content)

          print('Comprehensive fixes applied successfully.')
          "

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Restore pristine proxy modules and apply clean PKKStore rebranding" || echo "No changes to commit"
          git push origin main

      - name: Trigger Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml --ref main

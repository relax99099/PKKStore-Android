name: Comprehensive Fix and Build

on:
  workflow_dispatch:

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Comprehensive Fixes
        run: |
          python3 -c "
          import os
          import re
          import urllib.request

          # Remove broken experimental files
          bad_files = [
              'app/src/main/java/moe/matsuri/nb4a/proxy/shadowtls/ShadowTLSFmt.kt'
          ]
          for f in bad_files:
              if os.path.exists(f):
                  os.remove(f)
                  print(f'Removed {f}')

          def download_upstream(path):
              url = f'https://raw.githubusercontent.com/MatsuriDayo/NekoBoxForAndroid/master/{path}'
              try:
                  with urllib.request.urlopen(url) as response:
                      return response.read().decode('utf-8')
              except Exception as e:
                  print(f'Error downloading {path}: {e}')
                  return None

          # 1. Restore and Rebrand strings.xml
          res_dir = 'app/src/main/res'
          for root, dirs, files in os.walk(res_dir):
              for file in files:
                  if file == 'strings.xml':
                      rel_path = os.path.relpath(os.path.join(root, file))
                      print(f'Restoring and rebranding {rel_path}')
                      upstream_content = download_upstream(rel_path)
                      if upstream_content:
                          content = upstream_content.replace('NekoBox', 'PKKStore').replace('Matsuri', 'PKKStore')
                          content = re.sub(r'<string name=\"app_name\" translatable=\"false\">.*?</string>', 
                                         '<string name=\"app_name\" translatable=\"false\">PKKStore</string>', content)
                          content = re.sub(r\"(?<!\\\\)'\", \"\\\\'\", content)
                          
                          with open(rel_path, 'w', encoding='utf-8') as f:
                              f.write(content)

          # 2. Fix Kotlin Syntax in NGUtil.kt, Subnet.kt, Commandline.kt, RawUpdater.kt
          files_to_fix = [
              'app/src/main/java/moe/matsuri/nb4a/utils/NGUtil.kt',
              'app/src/main/java/io/nekohasekai/sagernet/utils/Subnet.kt',
              'app/src/main/java/io/nekohasekai/sagernet/utils/Commandline.kt',
              'app/src/main/java/io/nekohasekai/sagernet/group/RawUpdater.kt'
          ]
          for rel_path in files_to_fix:
              print(f'Restoring clean upstream {rel_path}')
              upstream_content = download_upstream(rel_path)
              if upstream_content:
                  with open(rel_path, 'w', encoding='utf-8') as f:
                      f.write(upstream_content)

          # 3. Fix build.gradle.kts
          app_gradle = 'app/build.gradle.kts'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  content = f.read()
              content = re.sub(r'applicationId = \".*?\"', 'applicationId = \"pkg.pkkstore\"', content)
              with open(app_gradle, 'w') as f:
                  f.write(content)

          # 4. Fix nb4a.properties
          nb4a_props = 'nb4a.properties'
          if os.path.exists(nb4a_props):
              with open(nb4a_props, 'r') as f:
                  content = f.read()
              content = re.sub(r'flavor=.*', 'flavor=oss', content)
              with open(nb4a_props, 'w') as f:
                  f.write(content)
          "

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Remove broken ShadowTLSFmt.kt and restore clean upstream files" || echo "No changes to commit"
          git push origin main

      - name: Trigger Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml --ref main

name: Revert Package and Fix

on:
  workflow_dispatch:

jobs:
  revert-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert Package and Fix Syntax
        run: |
          # Revert package names in all .kt and .java files
          find app/src/main/java -name "*.kt" -o -name "*.java" | xargs sed -i 's/package pkg.pkkstore/package io.nekohasekai.sagernet/g'
          find app/src/main/java -name "*.kt" -o -name "*.java" | xargs sed -i 's/import pkg.pkkstore/import io.nekohasekai.sagernet/g'
          
          # Fix Commandline.kt syntax errors
          PATH_CL="app/src/main/java/io/nekohasekai/sagernet/utils/Commandline.kt"
          if [ -f "$PATH_CL" ]; then
            # Fix the corrupted line 45
            # The corrupted line looks like: ' ', '\', '"', '\'' ->
            # It should be: ' ', '\\', '"', '\'' ->
            sed -i "s/' ', '\\\\', '\"', '\\\\''/' ', '\\\\\\\\', '\"', '\\\\''/g" "$PATH_CL"
            # Fix result.append('\') to result.append('\\')
            sed -i "s/result.append('\\\\')/result.append('\\\\\\\\')/g" "$PATH_CL"
          fi
          
          # Fix NGUtil.kt syntax errors
          PATH_NG="app/src/main/java/io/nekohasekai/sagernet/utils/NGUtil.kt"
          if [ -f "$PATH_NG" ]; then
            sed -i "s/split('\\\\'.')/split('.')/g" "$PATH_NG"
          fi

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Revert internal package names and fix Kotlin syntax" || echo "No changes to commit"
          git push
      
      - name: Trigger Build
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'
